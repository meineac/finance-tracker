$kind: http-request
url: "{{baseUrl}}/api/non-existent-route-path"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404 Not Found', function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 1000
