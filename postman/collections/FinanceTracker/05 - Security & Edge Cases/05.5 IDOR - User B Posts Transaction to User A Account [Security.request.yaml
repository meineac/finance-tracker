$kind: http-request
name: 05.5 IDOR - User B Posts Transaction to User A Account [Security 404]
url: "{{baseUrl}}/api/transactions"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{userB_token}}
body:
  type: text
  content: |-
    {
      "accountId": {{cardAccountId}},
      "categoryId": {{categoryId}},
      "type": "INCOME",
      "amount": 9999.00,
      "description": "Malicious transaction by User B"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('IDOR protection: User B cannot modify User A account (404/403)', function () {
          pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
    language: text/javascript
order: 5000
