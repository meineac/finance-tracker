services:
  postgres:
    image: postgres:18.4-alpine
    container_name: postgres-finance-tracker
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
    name: postgres-finance-tracker-volume
    driver: local